<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Assignments</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">LearnTogether</a><a class="nav-link" href="/courses">Courses</a></header><main><h1>Assignments</h1><p class="success-message" th:if="${message}" th:text="${message}"></p><p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p><section class="form-card" th:if="${currentUser != null and currentUser.role.name()=='INSTRUCTOR'}"><h2>Create assignment</h2><form th:action="@{'/instructor/courses/'+${courseId}+'/assignments'}" method="post"><input name="title" placeholder="Assignment title"><textarea name="instructions" placeholder="Instructions"></textarea><input type="datetime-local" name="dueAt"><button class="button">Publish assignment</button></form></section><section class="list-section"><article th:each="a:${assignments}"><h2 th:text="${a.title}">Title</h2><p th:text="${a.instructions}">Instructions</p><p th:if="${a.dueAt}" th:text="${'Due: '+a.dueAt}"></p><form th:if="${currentUser != null and currentUser.role.name()=='STUDENT'}" th:action="@{'/assignments/'+${a.id}+'/submit'}" method="post"><input type="hidden" name="courseId" th:value="${courseId}"><input name="submissionLink" placeholder="Google Drive, GitHub, or file link"><button class="button">Submit assignment</button></form></article><p th:if="${#lists.isEmpty(assignments)}">No assignments yet.</p></section></main></body></html>
