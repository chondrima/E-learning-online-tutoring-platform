<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lessons</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">LearnTogether</a><a class="nav-link" href="/courses">Course catalog</a></header><main><section class="page-heading"><p class="eyebrow">COURSE LESSONS</p><h1>Learning progress: <span th:text="${progress}">0</span>%</h1></section><section class="list-section"><article th:each="lesson : ${lessons}"><h2 th:text="${lesson.position + '. ' + lesson.title}">Lesson</h2><p th:text="${lesson.content}">Content</p><p th:if="${lesson.videoUrl != null and !lesson.videoUrl.isBlank()}"><a class="nav-link" th:href="${lesson.videoUrl}" target="_blank">Open video resource</a></p><p th:if="${lesson.resourceUrl != null and !lesson.resourceUrl.isBlank()}"><a class="nav-link" th:href="${lesson.resourceUrl}" target="_blank">Open PDF/resource</a></p><form th:if="${currentUser.role.name() == 'STUDENT'}" th:action="@{'/lessons/'+${lesson.id}+'/complete'}" method="post"><input type="hidden" name="courseId" th:value="${courseId}"><button class="button" type="submit">Mark complete</button></form></article><p th:if="${#lists.isEmpty(lessons)}">No lessons have been published yet.</p></section></main></body></html>
