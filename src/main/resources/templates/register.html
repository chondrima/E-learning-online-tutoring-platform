<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | LearnTogether</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <a class="brand" href="/">LearnTogether</a>
    <a class="nav-link" href="/">Home</a>
</header>

<main class="form-page">
    <section class="form-card">
        <p class="eyebrow">CREATE AN ACCOUNT</p>
        <h1>Join LearnTogether</h1>

        <p class="description">
            Students can join courses. Instructors can create courses
            after approval by an administrator.
        </p>

        <form th:action="@{/register}"
              th:object="${registrationForm}"
              method="post">

            <p class="form-error"
               th:if="${#fields.hasGlobalErrors()}"
               th:errors="*{global}">
                Registration error
            </p>

            <label for="fullName">Full name</label>
            <input id="fullName"
                   type="text"
                   th:field="*{fullName}"
                   autocomplete="name">
            <p class="field-error"
               th:if="${#fields.hasErrors('fullName')}"
               th:errors="*{fullName}">
                Full name error
            </p>

            <label for="email">Email address</label>
            <input id="email"
                   type="email"
                   th:field="*{email}"
                   autocomplete="email">
            <p class="field-error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">
                Email error
            </p>

            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   th:field="*{password}"
                   autocomplete="new-password">
            <p class="field-error"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">
                Password error
            </p>

            <label for="role">I am registering as</label>
            <select id="role" th:field="*{role}">
                <option value="">Choose an account type</option>
                <option value="STUDENT">Student</option>
                <option value="INSTRUCTOR">Instructor</option>
            </select>
            <p class="field-error"
               th:if="${#fields.hasErrors('role')}"
               th:errors="*{role}">
                Role error
            </p>

            <button class="button" type="submit">Create account</button>
        </form>
    </section>
</main>
</body>
</html>
