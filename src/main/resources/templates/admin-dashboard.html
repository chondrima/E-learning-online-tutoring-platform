<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | LearnTogether</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header><a class="brand" href="/">LearnTogether</a><a class="nav-link" href="/courses">Course catalog</a></header><main><section class="page-heading"><p class="eyebrow">ADMINISTRATION</p><h1>Approval dashboard</h1></section><section class="admin-grid"><div class="list-section"><h2>Pending instructors</h2><article th:each="instructor : ${pendingInstructors}"><h3 th:text="${instructor.fullName}">Name</h3><p th:text="${instructor.email}">email</p><form th:action="@{'/admin/instructors/' + ${instructor.id} + '/approve'}" method="post"><button class="button" type="submit">Approve instructor</button></form></article><p th:if="${#lists.isEmpty(pendingInstructors)}">No instructor accounts are waiting.</p></div><div class="list-section"><h2>Draft courses</h2><article th:each="course : ${draftCourses}"><h3 th:text="${course.title}">Course</h3><p>By <span th:text="${course.instructor.fullName}">Instructor</span></p><form th:action="@{'/admin/courses/' + ${course.id} + '/publish'}" method="post"><button class="button" type="submit">Publish course</button></form></article><p th:if="${#lists.isEmpty(draftCourses)}">No course drafts are waiting.</p></div></section></main></body></html>
