<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Courses | LearnTogether</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header><a class="brand" href="/">LearnTogether</a><nav class="header-actions"><a class="nav-link" href="/">Home</a><a class="nav-link" th:if="${currentUser == null}" href="/login">Login</a><a class="nav-link" th:if="${currentUser != null and currentUser.role.name() == 'INSTRUCTOR'}" href="/instructor/courses">My courses</a><a class="nav-link" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}" href="/admin">Admin</a></nav></header>
<main>
<section class="page-heading"><p class="eyebrow">COURSE CATALOG</p><h1>Find your next course</h1></section>
<p class="success-message" th:if="${message}" th:text="${message}">Success</p><p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>
<section class="features" th:if="${!#lists.isEmpty(courses)}"><article th:each="course : ${courses}"><p class="eyebrow" th:text="${course.category}">Category</p><h2 th:text="${course.title}">Course</h2><p th:text="${course.description}">Description</p><p><strong>Instructor:</strong> <span th:text="${course.instructor.fullName}">Instructor</span></p><p><strong>Price:</strong> <span th:if="${course.price.signum() == 0}">Free</span><span th:if="${course.price.signum() != 0}" th:text="${'BDT ' + course.price}">BDT 0</span></p><a class="nav-link" th:href="@{'/courses/'+${course.id}+'/lessons'}">View lessons</a> <a class="nav-link" th:href="@{'/courses/'+${course.id}+'/assignments'}">Assignments</a><form th:if="${currentUser != null and currentUser.role.name() == 'STUDENT' and course.price.signum() == 0}" th:action="@{/courses/enroll}" method="post"><input type="hidden" name="courseId" th:value="${course.id}"><button class="button" type="submit">Enroll free</button></form><form th:if="${currentUser != null and currentUser.role.name() == 'STUDENT' and course.price.signum() != 0}" th:action="@{/courses/pay}" method="post"><input type="hidden" name="courseId" th:value="${course.id}"><button class="button" type="submit">Pay and enroll</button></form><form th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}" th:action="@{/courses/review}" method="post"><input type="hidden" name="courseId" th:value="${course.id}"><label>Rating <select name="stars"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></label><input name="comment" placeholder="Optional review"><button class="nav-link logout-button" type="submit">Submit review</button></form></article></section>
<section class="empty-state" th:if="${#lists.isEmpty(courses)}"><h2>No published courses yet</h2><p>An approved instructor can create a course and an administrator can publish it.</p></section>
</main></body></html>
