<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Tutoring</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">LearnTogether</a><a class="nav-link" href="/courses">Courses</a></header><main><section class="page-heading"><p class="eyebrow">ONLINE TUTORING</p><h1>Available tutoring sessions</h1></section><p class="success-message" th:if="${message}" th:text="${message}"></p><p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p><section class="form-card" th:if="${currentUser != null and currentUser.role.name() == 'INSTRUCTOR'}"><h2>Publish an available slot</h2><form th:action="@{/tutoring/slots}" method="post"><label>Start</label><input type="datetime-local" name="startsAt"><label>End</label><input type="datetime-local" name="endsAt"><label>Meeting link</label><input name="meetingLink"><button class="button">Publish slot</button></form></section><section class="features"><article th:each="slot:${slots}"><h2 th:text="${slot.instructor.fullName}">Instructor</h2><p th:text="${slot.startsAt}">Time</p><form th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}" th:action="@{'/tutoring/'+${slot.id}+'/book'}" method="post"><button class="button">Book session</button></form></article></section></main></body></html>
