<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Course quiz</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">LearnTogether</a></header><main class="form-page wide-page"><section class="form-card"><h1>Course quiz</h1><form th:action="@{'/courses/'+${courseId}+'/quiz'}" method="post"><article th:each="q:${questions}"><h3 th:text="${q.questionText}">Question</h3><label><input type="radio" th:name="${'question_'+q.id}" value="A"> <span th:text="${q.optionA}">A</span></label><label><input type="radio" th:name="${'question_'+q.id}" value="B"> <span th:text="${q.optionB}">B</span></label><label><input type="radio" th:name="${'question_'+q.id}" value="C"> <span th:text="${q.optionC}">C</span></label><label><input type="radio" th:name="${'question_'+q.id}" value="D"> <span th:text="${q.optionD}">D</span></label></article><button class="button" type="submit">Submit quiz</button></form></section></main></body></html>
