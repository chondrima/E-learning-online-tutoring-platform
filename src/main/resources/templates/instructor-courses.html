<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My courses | LearnTogether</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header><a class="brand" href="/">LearnTogether</a><a class="nav-link" href="/courses">Course catalog</a></header>
<main class="form-page wide-page"><section class="form-card"><p class="eyebrow">INSTRUCTOR AREA</p><h1>Create a course</h1><p class="description">New courses begin as drafts and require administrator publication.</p>
<form th:action="@{/instructor/courses}" th:object="${courseForm}" method="post"><label for="title">Course title</label><input id="title" type="text" th:field="*{title}"><p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</p><label for="category">Category</label><input id="category" type="text" th:field="*{category}"><p class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category error</p><label for="description">Description</label><textarea id="description" th:field="*{description}"></textarea><p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</p><label for="price">Price in BDT</label><input id="price" type="number" min="0" step="0.01" th:field="*{price}"><p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</p><button class="button" type="submit">Save draft course</button></form></section>
<section class="list-section"><h2>My courses</h2><article th:each="course : ${courses}"><h3 th:text="${course.title}">Course</h3><p><strong>Status:</strong> <span th:text="${course.status}">DRAFT</span></p><a class="nav-link" th:href="@{'/instructor/courses/' + ${course.id} + '/lessons'}">Manage lessons</a> <a class="nav-link" th:href="@{'/instructor/courses/' + ${course.id} + '/quiz'}">Manage quiz</a></article><p th:if="${#lists.isEmpty(courses)}">You have not created a course yet.</p></section></main></body></html>
