<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | LearnTogether</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <a class="brand" href="/">LearnTogether</a>
    <a class="nav-link" href="/register">Create account</a>
</header>

<main class="form-page">
    <section class="form-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login</h1>
        <p class="description">Use the email address and password from registration.</p>

        <form th:action="@{/login}" th:object="${loginForm}" method="post">
            <p class="form-error"
               th:if="${#fields.hasGlobalErrors()}"
               th:errors="*{global}">Login error</p>

            <label for="email">Email address</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email">
            <p class="field-error" th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">Email error</p>

            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}"
                   autocomplete="current-password">
            <p class="field-error" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">Password error</p>

            <button class="button" type="submit">Login</button>
        </form>
    </section>
</main>
</body>
</html>
