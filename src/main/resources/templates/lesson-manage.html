<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage lessons</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">LearnTogether</a></header><main class="form-page wide-page"><section class="form-card"><h1>Add a lesson</h1><form th:action="@{'/instructor/courses/'+${courseId}+'/lessons'}" th:object="${lessonForm}" method="post"><label>Title</label><input th:field="*{title}"><label>Lesson content</label><textarea th:field="*{content}"></textarea><label>Video URL (optional)</label><input th:field="*{videoUrl}"><label>PDF/resource URL (optional)</label><input th:field="*{resourceUrl}"><button class="button" type="submit">Add lesson</button></form></section><section class="list-section"><h2>Existing lessons</h2><article th:each="lesson:${lessons}"><h3 th:text="${lesson.title}">Lesson</h3></article></section></main></body></html>
