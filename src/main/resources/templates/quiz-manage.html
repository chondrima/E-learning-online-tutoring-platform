<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quiz questions</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">LearnTogether</a></header><main class="form-page wide-page"><section class="form-card"><h1>Add quiz question</h1><form th:action="@{'/instructor/courses/'+${courseId}+'/quiz'}" th:object="${questionForm}" method="post"><label>Question</label><textarea th:field="*{questionText}"></textarea><label>Option A</label><input th:field="*{optionA}"><label>Option B</label><input th:field="*{optionB}"><label>Option C</label><input th:field="*{optionC}"><label>Option D</label><input th:field="*{optionD}"><label>Correct option</label><select th:field="*{correctOption}"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select><button class="button" type="submit">Add question</button></form></section><section class="list-section"><h2>Questions</h2><article th:each="q:${questions}"><p th:text="${q.questionText}">Question</p></article></section></main></body></html>
